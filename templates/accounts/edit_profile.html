{% extends 'base.html' %}
{% block title %}Edit Profile — ShopWave{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="checkout-section">
        <div class="d-flex align-items-center gap-3 mb-4">
          <a href="{% url 'profile' %}" class="btn sw-btn-outline btn-sm"><i class="bi bi-arrow-left"></i></a>
          <h4 class="fw-700 mb-0">Edit Profile</h4>
        </div>
        <form method="POST" enctype="multipart/form-data">
          {% csrf_token %}
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-600">First Name</label>
              {{ form.first_name }}
            </div>
            <div class="col-md-6">
              <label class="form-label fw-600">Last Name</label>
              {{ form.last_name }}
            </div>
            <div class="col-md-6">
              <label class="form-label fw-600">Email</label>
              {{ form.email }}
            </div>
            <div class="col-md-6">
              <label class="form-label fw-600">Phone</label>
              {{ form.phone }}
            </div>
            <div class="col-md-6">
              <label class="form-label fw-600">Date of Birth</label>
              {{ form.date_of_birth }}
            </div>
            <div class="col-md-6">
              <label class="form-label fw-600">Profile Photo</label>
              {{ form.avatar }}
            </div>
            <div class="col-12">
              <label class="form-label fw-600">Bio</label>
              {{ form.bio }}
            </div>
            <div class="col-12 d-flex gap-3">
              <button type="submit" class="btn sw-btn-primary px-5">
                <i class="bi bi-check2 me-1"></i>Save Changes
              </button>
              <a href="{% url 'profile' %}" class="btn sw-btn-outline px-5">Cancel</a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
