{% extends 'base.html' %}
{% block title %}Change Password — ShopWave{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-5">
      <div class="checkout-section">
        <div class="d-flex align-items-center gap-3 mb-4">
          <a href="{% url 'profile' %}" class="btn sw-btn-outline btn-sm"><i class="bi bi-arrow-left"></i></a>
          <h4 class="fw-700 mb-0">Change Password</h4>
        </div>
        <form method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-600">Current Password</label>
            {{ form.old_password }}
          </div>
          <div class="mb-3">
            <label class="form-label fw-600">New Password</label>
            {{ form.new_password1 }}
          </div>
          <div class="mb-4">
            <label class="form-label fw-600">Confirm New Password</label>
            {{ form.new_password2 }}
          </div>
          {% if form.errors %}
          <div class="alert alert-danger">{{ form.errors }}</div>
          {% endif %}
          <button type="submit" class="btn sw-btn-primary w-100">
            <i class="bi bi-lock-fill me-2"></i>Update Password
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
