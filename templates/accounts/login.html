{% extends 'base.html' %}
{% block title %}Login — ShopWave{% endblock %}

{% block content %}
<div class="auth-page d-flex align-items-center justify-content-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7">
        <div class="auth-card">
          <div class="auth-logo text-center mb-4">
            <a href="{% url 'home' %}" class="sw-logo fs-2 text-decoration-none">
              <span class="logo-icon"><i class="bi bi-bag-heart-fill"></i></span>
              <span class="logo-text">Shop<span class="logo-accent">Wave</span></span>
            </a>
          </div>
          <h3 class="fw-700 text-center mb-1">Welcome Back!</h3>
          <p class="text-muted text-center mb-4">Sign in to your ShopWave account</p>

          <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label fw-600">Email Address</label>
              {{ form.email }}
            </div>
            <div class="mb-3">
              <div class="d-flex justify-content-between">
                <label class="form-label fw-600">Password</label>
                <a href="#" class="text-primary small">Forgot Password?</a>
              </div>
              {{ form.password }}
            </div>
            <div class="mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe" />
                <label class="form-check-label text-muted" for="rememberMe">Remember me</label>
              </div>
            </div>
            <button type="submit" class="btn sw-btn-primary w-100 btn-lg">
              <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
          </form>

          <div class="text-center mt-4">
            <span class="text-muted">Don't have an account?</span>
            <a href="{% url 'register' %}" class="text-primary fw-600 ms-1">Create Account</a>
          </div>

          <div class="divider my-4"><span>or continue with</span></div>

          <div class="d-flex gap-3">
            <button class="btn btn-outline-secondary flex-fill" onclick="showToast('info', 'Social login coming soon!')">
              <i class="fab fa-google me-2 text-danger"></i>Google
            </button>
            <button class="btn btn-outline-secondary flex-fill" onclick="showToast('info', 'Social login coming soon!')">
              <i class="fab fa-facebook me-2 text-primary"></i>Facebook
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
